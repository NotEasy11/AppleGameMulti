<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사과 게임 with people</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<section id="screen-title" class="screen active">
  <h1>🍎 사과 게임 with people</h1>
  <p id="title-tagline">드래그해서 합이 10이 되는 사과를 지우세요. 제한 시간 120초, 총 228개의 사과</p>
  <div class="mode-buttons">
    <button id="btn-daily">데일리 챌린지</button>
    <button id="btn-practice" class="secondary">자유 연습</button>
  </div>
  <p id="daily-note" class="daily-note">데일리 챌린지는 하루에 한 번만 도전할 수 있습니다.</p>
  <button id="btn-view-leaderboard" class="link-button">랭킹 보기</button>
</section>

<section id="screen-leaderboard" class="screen">
  <h2>랭킹</h2>
  <div class="leaderboard-tabs">
    <button id="tab-daily" class="tab-button active" data-period="daily">일간</button>
    <button id="tab-weekly" class="tab-button" data-period="weekly">주간</button>
    <button id="tab-alltime" class="tab-button" data-period="alltime">전체</button>
  </div>
  <ol id="leaderboard-list" class="leaderboard-list"></ol>
  <button id="btn-leaderboard-back" class="secondary">돌아가기</button>
</section>

<section id="screen-game" class="screen">
  <div class="timer-bar-wrap"><div id="timer-bar"></div></div>
  <div id="timer-label">남은 시간 120초</div>
  <div class="game-layout">
    <div class="side-panel">
      <h3>점수</h3>
      <div id="score-value">0</div>
      <h3>남은 사과</h3>
      <div id="apples-left-value">228</div>
      <button id="btn-quit" class="secondary" style="margin-top:24px;width:100%;">포기</button>
    </div>

    <div id="board-hitzone" class="board-hitzone">
      <div id="board-frame" class="board-frame">
        <div id="board" class="board"></div>
      </div>
      <div id="board-hit-overlay" class="board-hit-overlay"></div>
      <div id="countdown-overlay" class="countdown-overlay"></div>
    </div>

    <div class="side-panel">
      <h3>오늘의 1위</h3>
      <div id="today-top-score">-</div>
      <h3>오늘의 TOP5</h3>
      <ol id="top5-list" class="top5-list">
        <li class="top5-empty">집계 중...</li>
      </ol>
    </div>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="result-card">
    <div id="result-reason">시간 종료</div>
    <div class="big-score" id="result-score">0</div>
    <div class="result-stats">
      <div id="result-accuracy">정확도 0% (0/0)</div>
      <div id="result-max-removal">최대 1회 제거 0개</div>
    </div>

    <div id="submit-section" class="submit-section">
      <input id="nickname-input" type="text" maxlength="12" placeholder="닉네임 (최대 12자)">
      <button id="btn-submit-score">랭킹 등록</button>
      <div id="submit-message" class="submit-message"></div>
    </div>

    <button id="btn-retry">다시하기</button>
  </div>
</section>

<script type="module" src="/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Score</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
  }
  .card {
    text-align: center;
    padding: 48px 64px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }
  #score {
    font-size: 64px;
    font-weight: 700;
    color: #1d1d1f;
    margin: 0 0 24px;
  }
  button {
    font-size: 20px;
    font-weight: 600;
    padding: 12px 32px;
    border: none;
    border-radius: 10px;
    background: #0071e3;
    color: #fff;
    cursor: pointer;
  }
  button:active {
    background: #005bb5;
  }
</style>
</head>
<body>
  <div class="card">
    <p id="score">0</p>
    <button id="helloBtn">Hello</button>
  </div>

  <script>
    let score = 0;
    const scoreEl = document.getElementById('score');
    document.getElementById('helloBtn').addEventListener('click', () => {
      score += 1;
      scoreEl.textContent = score;
    });
  </script>
</body>
</html>
